<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>babblecake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--navy:#0E1B3D;--panel:#16254F;--line:#2F4580;--bubble:#5BB8FF;--bubble-edge:#A8DAFF;--yellow:#FFD23F;--red:#FF4D4D;--orange:#FF8A1F;--ink:#0A1F5C;--text:#FFFFFF;--muted:#C9D6F5;--dim:#7FA3E6;--word:#1A2B5C;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--navy:#0E1B3D;--panel:#16254F;--line:#2F4580;--bubble:#5BB8FF;--bubble-edge:#A8DAFF;--yellow:#FFD23F;--red:#FF4D4D;--orange:#FF8A1F;--ink:#0A1F5C;--text:#FFFFFF;--muted:#C9D6F5;--dim:#7FA3E6;--word:#1A2B5C}}
:root[data-theme="dark"]{--navy:#0E1B3D;--panel:#16254F;--line:#2F4580;--bubble:#5BB8FF;--bubble-edge:#A8DAFF;--yellow:#FFD23F;--red:#FF4D4D;--orange:#FF8A1F;--ink:#0A1F5C;--text:#FFFFFF;--muted:#C9D6F5;--dim:#7FA3E6;--word:#1A2B5C}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--navy)}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--text);font-family:Poppins,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
#app{max-width:430px;margin:0 auto;padding:8px 20px 14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.mark{font-size:32px;font-weight:700;letter-spacing:-1.5px;line-height:1;color:var(--orange);height:34px;display:flex;align-items:center}
.tabs{display:flex;gap:8px;width:100%}
.tab{flex:1 1 0;min-width:0;height:38px;border-radius:12px;border:2px solid var(--bubble);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.tab.en{background:var(--bubble);color:var(--ink)}
.tab.es{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.tab.fr{background:var(--text);border-color:var(--text);color:var(--ink)}
.word{position:relative;display:flex;align-items:center;justify-content:center;width:92%;min-height:54px;border-radius:18px;background:var(--word);border:2px solid var(--bubble);margin-top:4px;padding:0 14px;overflow:hidden}
.word .t{font-size:30px;font-weight:600;letter-spacing:4px;color:var(--text);white-space:nowrap}
.word .ph{font-size:13px;color:var(--dim);font-weight:400;white-space:nowrap}
.word.shake{animation:shake .38s}
.word.m-ok,.word.m-red,.word.m-yellow{color:var(--ink)}
.word.m-ok{background:var(--bubble);border-color:var(--bubble-edge)}
.word.m-red{background:var(--red);border-color:var(--red)}
.word.m-yellow{background:var(--yellow);border-color:var(--yellow)}
.word.m-err{background:var(--panel)}
.word .mt{font-size:15px;font-weight:600;text-align:center;line-height:1.25;color:inherit}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.msg{display:flex;align-items:center;justify-content:center;gap:8px;min-height:28px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:500;background:var(--panel);color:var(--muted);text-align:center}
.msg.err{background:var(--panel);color:var(--text)}
.msg.idle{background:transparent}
.msg.red{background:var(--red);color:var(--ink);font-weight:700}
.msg.yellow{background:var(--yellow);color:var(--ink);font-weight:700}
.msg.ok{background:var(--bubble);color:var(--ink);font-weight:600}
#bwrap{flex:none;width:290px;height:290px}
#board{position:relative;width:290px;height:290px;transform-origin:0 0}
.bub{position:absolute;width:86px;height:86px;padding:0;border-radius:50%;border:2px solid var(--bubble-edge);background:var(--bubble);color:var(--ink);font-size:36px;font-weight:600;line-height:1;box-shadow:0 0 22px rgba(91,184,255,0.55),inset -5px -7px 0 rgba(10,31,92,0.18),inset 4px 4px 0 rgba(255,255,255,0.4);cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;text-transform:uppercase}
.bub:active{transform:scale(.95)}
.bub.c{width:92px;height:92px;border-color:#FFE88A;background:var(--yellow);font-size:40px;font-weight:700;box-shadow:0 0 26px rgba(255,210,63,0.65),inset -5px -7px 0 rgba(10,31,92,0.16),inset 4px 4px 0 rgba(255,255,255,0.5)}
.pop{position:absolute;z-index:10;display:flex;gap:6px;padding:6px;border-radius:14px;background:var(--panel);border:2px solid var(--bubble);box-shadow:0 6px 20px rgba(0,0,0,.45)}
.pk{width:44px;height:44px;border-radius:12px;border:2px solid var(--bubble);background:var(--bubble);color:var(--ink);font-size:22px;font-weight:600;cursor:pointer}
.actions{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.btn{height:46px;padding:0 24px;border-radius:14px;border:2px solid var(--bubble);background:transparent;color:var(--text);font-size:17px;font-weight:500;cursor:pointer}
.btn.round{width:46px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.btn.enter{padding:0 30px;border-color:var(--red);background:var(--red);color:var(--ink);font-weight:700;box-shadow:0 0 18px rgba(255,77,77,0.45)}
.finish{width:100%;height:40px;border-radius:14px;border:2px solid var(--bubble);background:transparent;color:var(--text);font-size:16px;font-weight:500;cursor:pointer}
.panel{width:100%;border-radius:18px;background:var(--panel);border:2px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1 1 0;min-height:0;overflow:auto}
.ph-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lvl{font-size:14px;font-weight:600}
.sc{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--dim);background:transparent}
.dot.on{background:var(--yellow);border-color:var(--yellow)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.chip{height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;border:2px solid transparent}
.chip.en{background:var(--bubble);color:var(--ink)}
.chip.es{background:var(--yellow);color:var(--ink)}
.chip.fr{background:var(--text);color:var(--ink)}
.chip.cog{box-shadow:0 0 0 2px var(--red)}
.chip .lg{display:flex;gap:3px}
.chip .lg i{width:8px;height:8px;border-radius:50%;display:block;border:1.5px solid currentColor;opacity:.85}
.empty{font-size:13px;color:var(--dim)}
#modal{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(5,10,30,0.72);display:none;align-items:center;justify-content:center;padding:0 30px;z-index:50}
#modal.on{display:flex}
.dlg{width:100%;max-width:360px;border-radius:18px;background:var(--panel);border:2px solid var(--bubble);padding:24px 22px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:24px;font-weight:600}
.dlg p{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
.dlg .col{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.dbtn{height:48px;border-radius:14px;border:2px solid var(--bubble);background:transparent;color:var(--text);font-size:16px;font-weight:500;cursor:pointer}
.dbtn.pri{background:var(--bubble);color:var(--ink);font-weight:600}
.dbtn.fin{border-color:var(--red)}
#results{display:none}
#results.on{display:flex}
.res{max-width:430px;margin:0 auto;padding:14px 20px 32px;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.big{font-size:44px;font-weight:700;color:var(--orange);letter-spacing:-1px;line-height:1}
.sub{font-size:16px;color:var(--muted)}
.sec{width:100%;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:16px;font-weight:600}
.sec .note{font-size:13px;color:var(--muted);margin-top:-4px}
.card{border-radius:14px;background:var(--panel);border:2px solid var(--line);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rv{height:30px;padding:0 10px;border-radius:15px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;border:2px dashed var(--dim);color:var(--muted);background:transparent}
.rv.got{border-style:solid;border-color:transparent;color:var(--ink);box-shadow:0 0 0 2px var(--red)}
.rv.got.en{background:var(--bubble)}
.rv.got.es{background:var(--yellow)}
.rv.got.fr{background:var(--text)}
.rv small{font-size:10px;font-weight:700;opacity:.8;text-transform:uppercase}
details{width:100%;border-radius:14px;background:var(--panel);border:2px solid var(--line);padding:10px 12px}
summary{cursor:pointer;font-size:15px;font-weight:600}
details h4{margin:12px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.row2{display:flex;gap:10px;width:100%}
.row2 .btn{flex:1 1 0;padding:0 10px}
.toast{font-size:13px;color:var(--yellow);min-height:18px}

.bub.glow{animation:bubglow 1.1s ease-in-out}
@keyframes bubglow{0%{transform:translateX(0) scale(1);filter:brightness(1)}12%{transform:translateX(-7px) scale(1.07) rotate(-3deg);filter:brightness(1.35) drop-shadow(0 0 14px #fff)}28%{transform:translateX(7px) scale(1.07) rotate(3deg);filter:brightness(1.4) drop-shadow(0 0 18px #fff)}44%{transform:translateX(-6px) scale(1.05) rotate(-2deg);filter:brightness(1.35) drop-shadow(0 0 14px #fff)}60%{transform:translateX(5px) scale(1.04) rotate(2deg);filter:brightness(1.25) drop-shadow(0 0 10px #fff)}80%{transform:translateX(-2px) scale(1.02);filter:brightness(1.12)}100%{transform:translateX(0) scale(1);filter:brightness(1)}}
#cakepop{position:fixed;left:0;top:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;z-index:60;pointer-events:none;background:rgba(5,10,30,0.6)}
#cakepop.on{display:flex;animation:cakefade 3s ease-in-out forwards}
#cakepop svg{width:230px;height:230px;animation:cakepop .6s cubic-bezier(.2,1.4,.4,1)}
#cakepop .cw{font-size:38px;font-weight:700;color:var(--orange);letter-spacing:-1px;text-align:center;animation:cakepop .6s .1s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes cakepop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes cakefade{0%{opacity:0}8%{opacity:1}78%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.bub.glow{animation:none}#cakepop svg,#cakepop .cw{animation:none}}
</style>
</head>

<div id="app">

<h2>Are you sure?</h2>

<div class="col">

</div>
</div>
</div>

(function(){
var LANGS=['en','es','fr'];

var NAMES=['Nibble','Bite','Two Bites','Slice','Cake'];
var STEP=15;
var ACC={a:['à','á','â','ä'],e:['é','è','ê','ë'],i:['î','ï','í','ì'],o:['ô','ó','ö','ò'],u:['ù','ú','û','ü'],c:['ç'],n:['ñ'],y:['ÿ']};
var POS=[[102,4],[187,53],[187,151],[102,200],[17,151],[17,53]];
function $(id){return document.getElementById(id)}
function base(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function lenPts(w){return w.length>7?10:w.length-2}
function sget(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function today(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)}

var pi=0,P,dict,cousin,order,cur=[],state,pressTimer=null,longFired=false,popup=null,msgTimer=null,msgOn=false;

function start(i){
  pi=((i%PUZZLES.length)+PUZZLES.length)%PUZZLES.length;
  P=PUZZLES[pi];dict=P.words;cousin=new Set(P.cousin);order=P.outer.slice();cur=[];
  state=sget('bc-'+P.id)||{found:{},done:false};
  sset('bc-current',{i:pi,day:today()});
  if(state.done){showResults()}else{showGame()}
}
function score(){var s=0;for(var w in state.found){var n=state.found[w];s+=lenPts(w)+(n-1)+(cousin.has(w)?1:0)}return s}
function levelIdx(s){return Math.min(5,Math.floor(s/STEP))}
function counts(){var c={en:0,es:0,fr:0};for(var w in state.found){var n=state.found[w],ls=dict[w];for(var i=0;i<Math.min(n,ls.length);i++)c[ls[i]]++}return c}
function dotsHtml(k){var h='';for(var i=0;i<5;i++)h+='<div class="dot'+(i<k?' on':'')+'"></div>';return '<div class="dots" aria-hidden="true">'+h+'</div>'}

function showGame(){
  $('app').style.display='flex';$('results').classList.remove('on');
  renderTabs();renderWord();renderBoard();renderPanel();setMsg('','idle',true);fit();
}
function renderTabs(){
  var c=counts();
  $('tabs').innerHTML=LANGS.map(function(l){return '<div class="tab '+l+'">'+LNAME[l]+' '+c[l]+'</div>'}).join('');
}
function renderWord(){
  var el=$('word');if(msgOn)return;el.classList.remove('m-ok','m-err','m-red','m-yellow');
  el.innerHTML=cur.length?'<span class="t">'+cur.join('').toUpperCase()+'</span>':'<span class="ph">Tap letters · hold for accents</span>';
}
function renderBoard(){
  var h='';
  order.forEach(function(l,i){h+='<button type="button" class="bub" data-l="'+l+'" aria-label="'+l.toUpperCase()+'" style="left:'+POS[i][0]+'px;top:'+POS[i][1]+'px">'+l+'</button>'});
  h+='<button type="button" class="bub c" data-l="'+P.center+'" aria-label="'+P.center.toUpperCase()+', the required letter" style="left:99px;top:99px">'+P.center+'</button>';
  $('board').innerHTML=h;

function chipHtml(w){
  var n=state.found[w],ls=dict[w],first=ls[0];
  var dots=ls.length>1?'<span class="lg">'+ls.slice(0,n).map(function(){return '<i></i>'}).join('')+'</span>':'';

function renderPanel(){
  var s=score(),k=levelIdx(s),ws=Object.keys(state.found).sort(function(a,b){return base(a).localeCompare(base(b))||a.localeCompare(b)});

function setMsg(t,kind,hold){

var CELEB={en:'Celebrate!',es:'¡Celebra!',fr:'Célébrons !'};

function enter(){
  if(state.done||!cur.length)return;
  var w=cur.join('');
  if(w.length<3)return bad('Too short');
  if(base(w).indexOf(P.center)<0)return bad('Missing the center letter');
  var ls=dict[w];
  if(!ls)return bad('Not in our word list yet');
  var n=state.found[w]||0;
  if(n>=ls.length)return bad('Already found');
  var before=score();
  state.found[w]=n+1;
  var pts,isPan=P.letters.every(function(c){return base(w).indexOf(c)>=0});
  if(n===0){
    pts=lenPts(w)+(cousin.has(w)?1:0);
    if(isPan)setMsg('Pangram! +'+pts+(cousin.has(w)?' · cognate':''),'yellow');

    setMsg('Same word, another language! +1','yellow');
  }
  if(n===0&&isPan)glowBubbles();
  if(before<STEP*5&&score()>=STEP*5&&!state.celebrated){state.celebrated=true;cakeCelebrate(ls[n])}

}

$('fin').addEventListener('click',function(){$('modal').classList.add('on')});
$('keep').addEventListener('click',function(){$('modal').classList.remove('on')});
$('doFin').addEventListener('click',function(){$('modal').classList.remove('on');state.done=true;sset('bc-'+P.id,state);showResults()});
document.addEventListener('keydown',function(e){
  if($('modal').classList.contains('on')||state.done||e.metaKey||e.ctrlKey)return;
  if(e.key==='Enter'){enter();return}
  if(e.key==='Backspace'){del();return}
  if(e.key.length===1){var k=e.key.toLowerCase();var bk=base(k);if(P.letters.indexOf(bk)>=0)add(k)}
});

/* results */
function got(w){return (state.found[w]||0)>0}
function showResults(){
  $('app').style.display='none';$('results').classList.add('on');
  var s=score(),k=levelIdx(s),all=Object.keys(dict),found=Object.keys(state.found);
  var missed=all.filter(function(w){return !got(w)});
  var h='<div class="mark">babblecake</div>';
  h+='<div class="big">'+(k?NAMES[k-1]:'Nibble?')+'</div>';
  h+='<div class="sub">'+s+' points · Cake at '+(STEP*5)+'</div>'+dotsHtml(k);
  h+='<div class="sub">'+found.length+' of '+all.length+' words found</div>';
  h+='<div class="row2"><button type="button" class="btn" id="share">Share</button><button type="button" class="btn" id="next">Play another</button></div><div class="toast" id="toast"></div>';
  h+='<div class="sec"><h3>Cognates revealed</h3><div class="note">Words that match across languages. Ringed in red means you found it.</div>';
  P.groups.forEach(function(g){
    h+='<div class="card">';
    g.forEach(function(it){
      var w=it[0],ls=it[1],f=got(w);
      var tag=ls.map(function(l){return l}).join(' ');
      h+='<span class="rv'+(f?' got '+ls[0]:'')+'">'+w+' <small>'+tag+'</small></span>';
    });
    h+='</div>';
  });
  h+='</div>';
  h+='<details><summary>Words you missed ('+missed.length+')</summary>';
  LANGS.forEach(function(l){
    var ms=missed.filter(function(w){return dict[w].indexOf(l)>=0}).sort(function(a,b){return base(a).localeCompare(base(b))});
    if(ms.length)h+='<h4>'+LNAME[l]+'</h4><div class="chips">'+ms.map(function(w){return '<span class="rv">'+w+'</span>'}).join('')+'</div>';
  });
  h+='</details>';
  $('resbody').innerHTML=h;
  $('next').addEventListener('click',function(){start(pi+1);window.scrollTo(0,0)});
  $('share').addEventListener('click',function(){
    var cog=0;found.forEach(function(w){if(cousin.has(w))cog++});
    var t='babblecake No. '+P.num+'\n'+(k?NAMES[k-1]:'Nibble?')+' · '+s+' points\n'+found.length+' words · '+cog+' cognates';
    shareText(t);
  });
  window.scrollTo(0,0);
}
function shareText(t){
  function done(m){$('toast').textContent=m}
  function fallback(){
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    ta.remove();done(ok?'Copied to share':t);
  }
  if(navigator.share){navigator.share({text:t}).catch(function(){})}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){done('Copied to share')}).catch(fallback)}
  else fallback();
}

function fit(){
  var vv=window.visualViewport,vh=vv?vv.height:window.innerHeight,vw=window.innerWidth;
  var st=getComputedStyle(document.documentElement);
  var safe=(parseFloat(st.paddingTop)||0)+(parseFloat(st.paddingBottom)||0);
  $('app').style.height=Math.round(vh-safe)+'px';
  var k=Math.min(1,(vh-safe-396)/290,(Math.min(vw,430)-32)/290);
  k=Math.max(0.5,k);
  var bw=$('bwrap'),bd=$('board');
  bw.style.width=Math.round(290*k)+'px';bw.style.height=Math.round(290*k)+'px';
  bd.style.transform='scale('+k+')';
}
window.addEventListener('resize',fit);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);

var cs=sget('bc-current');
start(cs&&cs.day===today()?cs.i:today());
})();
</script>
</body>
